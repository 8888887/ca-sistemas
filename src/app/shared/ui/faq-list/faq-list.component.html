<section class="faq-section" [attr.aria-label]="title() | translate">
  <h2 appReveal="left">{{ title() | translate }}</h2>
  @for (item of items(); track item.question; let position = $index) {
    <details open [appReveal]="position % 2 === 0 ? 'left' : 'right'">
      <summary><app-icon name="down" /><span>{{ item.question | translate }}</span></summary>
      <p>{{ item.answer | translate }}</p>
    </details>
  }
</section>
